[workspace]
members = ["dm-store-lib", "dm-store-cli", "dm-manager-lib", "dm-manager-cli"]
resolver = "2"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
rustyline = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
